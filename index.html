<style>
:root{--ink:#14340a;--card:#fffbe8;--accent:#ff9c1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#14340a;--card:#fffbe8}}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);text-align:center;pointer-events:none;color:#fff;text-shadow:0 3px 0 rgba(20,52,10,.55)}
#score{font-size:64px;font-weight:900;line-height:1.1;margin-top:10px}
#lvl{font-size:18px;font-weight:800}
#bar{width:140px;height:8px;border-radius:4px;background:rgba(20,52,10,.35);margin:6px auto 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#mute{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--card);font-size:22px;z-index:5}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,52,10,.25);z-index:4}
#card{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:22px 26px;text-align:center;color:var(--ink);box-shadow:0 8px 0 var(--ink);max-width:82%}
#card img{width:120px;height:120px;border-radius:26px;border:4px solid var(--ink);display:block;margin:0 auto 10px}
#card h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-1px}
#card p{margin:8px 0 0;font-size:16px;line-height:1.35}
#card b{display:inline-block;margin-top:14px;background:var(--accent);padding:10px 22px;border-radius:18px;border:3px solid var(--ink);font-size:18px}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:48px;font-weight:900;color:#fff;text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>

<script>
(function(){
var ICON=document.querySelector('link[rel=icon]').href;
try{var mf={name:'Green Bird',short_name:'Green Bird',display:'fullscreen',orientation:'portrait',background_color:'#8fd3ff',theme_color:'#6dbb1f',start_url:location.href,icons:[{src:ICON,sizes:'192x192',type:'image/png'}]};
var l=document.createElement('link');l.rel='manifest';l.href='data:application/json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(l);}catch(e){}

// ===== AUDIO =====
var AC=null,master=null,muted=false,musicOn=false,step=0;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){}}
function tone(f,d,type,v,to,delay){if(!AC)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}
var MEL=[523,659,784,659,587,698,880,698,659,784,988,784,698,659,587,523];
var BAS=[131,131,196,196,147,147,175,175];
function music(){if(!AC||!musicOn)return;var i=step%16;tone(MEL[i],.2,'square',.05);if(i%2===0)tone(BAS[(i/2)|0],.35,'triangle',.12);step++;}
setInterval(music,200);
function sFlap(){tone(420,.12,'triangle',.3,820)}
function sPoint(){tone(880,.08,'square',.1);tone(1320,.12,'square',.1,null,.07)}
function sLevel(){[523,659,784,1047].forEach(function(f,i){tone(f,.15,'square',.12,null,i*.1)})}
function sLose(){tone(500,.6,'sawtooth',.25,70);tone(120,.5,'square',.15,40,.1)}
function sWin(){[523,659,784,1047,1319,1568].forEach(function(f,i){tone(f,.2,'triangle',.2,null,i*.12)})}
var mb=document.getElementById('mute');
mb.addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();muted=!muted;if(master)master.gain.value=muted?0:.5;mb.textContent=muted?'🔇':'🔊'});

// ===== 3D =====
var cv=document.getElementById('c');
var R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene();S.background=new THREE.Color(0x8fd3ff);S.fog=new THREE.Fog(0x8fd3ff,30,70);
var cam=new THREE.PerspectiveCamera(60,1,.1,200);
function resize(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.set(1.5,0,Math.max(16,13/(2*.577*cam.aspect)));cam.lookAt(1.5,0,0);cam.updateProjectionMatrix();}
addEventListener('resize',resize);
S.add(new THREE.HemisphereLight(0xffffff,0x6a8a4a,.85));
var sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(-6,12,14);S.add(sun);

function M(c,o){return new THREE.MeshPhongMaterial(Object.assign({color:c},o||{}))}
function sph(r,c,x,y,z,sx,sy,sz,g){var m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),M(c));m.position.set(x,y,z);m.scale.set(sx||1,sy||1,sz||1);g.add(m);return m}
var bird=new THREE.Group(),inner=new THREE.Group();bird.add(inner);
sph(1,0x6dbb1f,0,0,0,1.05,.95,1,inner);
sph(.8,0xa9cf5c,.15,-.4,.45,1,.8,.8,inner);
[[.35,.35,.85],[.85,.3,.6]].forEach(function(p){sph(.38,0xffffff,p[0],p[1],p[2],1,1.05,.5,inner);sph(.2,0x2d7a1a,p[0]+.1,p[1],p[2]+.17,1,1,.5,inner);sph(.11,0x111111,p[0]+.12,p[1],p[2]+.3,1,1,.5,inner)});
[[.3,.78,.95,-.4],[.95,.72,.55,.4]].forEach(function(p){var b=new THREE.Mesh(new THREE.BoxGeometry(.7,.14,.12),M(0x2a2218));b.position.set(p[0],p[1],p[2]);b.rotation.z=p[3];inner.add(b)});
var beak=new THREE.Mesh(new THREE.ConeGeometry(.3,.7,16),M(0xff9c1a));beak.rotation.z=-Math.PI/2;beak.position.set(1.15,-.05,.5);beak.scale.set(1,1,.8);inner.add(beak);
var wing=sph(.5,0x58a517,-.25,-.1,.95,1.1,.55,.4,inner);
sph(.35,0x58a517,-.2,1,0,1.6,.35,.5,inner).rotation.z=.5;
sph(.3,0x58a517,-.55,.95,.1,1.4,.3,.5,inner).rotation.z=.9;
bird.scale.setScalar(.8);S.add(bird);

var pm=M(0xc9ced4,{specular:0xffffff,shininess:140}),rm=M(0x9aa1a9,{specular:0xffffff,shininess:100});
var pg=new THREE.CylinderGeometry(1.3,1.3,30,28),cg=new THREE.CylinderGeometry(1.6,1.6,1,28);
function mkPipe(top){var g=new THREE.Group(),b=new THREE.Mesh(pg,pm),c=new THREE.Mesh(cg,rm);b.position.y=top?15:-15;c.position.y=top?.5:-.5;g.add(b,c);S.add(g);return g}

var ground=new THREE.Mesh(new THREE.BoxGeometry(300,6,40),M(0x7ac943));ground.position.set(0,-11,0);S.add(ground);
var stripes=[];for(var i=0;i<16;i++){var s=new THREE.Mesh(new THREE.BoxGeometry(1.6,.1,40),M(0x5fae2e));s.position.set(i*3-12,-7.98,0);S.add(s);stripes.push(s)}
var clouds=[];for(i=0;i<9;i++){var cg2=new THREE.Group();for(var j=0;j<3;j++){var cs=new THREE.Mesh(new THREE.SphereGeometry(1.4-j*.15,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));cs.position.set(j*1.5-1.5,j%2*.4,0);cs.scale.y=.7;cg2.add(cs)}cg2.position.set(i*7-10,3+Math.random()*8,-8-Math.random()*14);S.add(cg2);clouds.push(cg2)}

// ===== GAME =====
var state='menu',vy=0,by=0,pipes=[],score=0,level=1,inLvl=0,t=0,deadAt=0,PER=4,MAXL=15,BX=-1.5;
var best=0;try{best=+localStorage.getItem('gb_best')||0}catch(e){}
var $=function(i){return document.getElementById(i)};
function params(L){return{speed:4.2+(L-1)*.38,gap:6.6-(L-1)*.17,space:12-(L-1)*.2,amp:L<5?0:Math.min(.5*(L-4),2.2),freq:1.2+L*.08}}
function spawn(){var P=params(level);var base=-2.5+Math.random()*5.5;pipes.push({x:9,top:mkPipe(true),bot:mkPipe(false),base:base,ph:Math.random()*6,gap:P.gap,amp:P.amp,fr:P.freq,passed:false,cy:base})}
function clearPipes(){pipes.forEach(function(p){S.remove(p.top);S.remove(p.bot)});pipes=[]}
function banner(txt){var b=$('banner');b.textContent=txt;b.style.opacity=1;setTimeout(function(){b.style.opacity=0},1200)}
function hud(){$('score').textContent=score;$('lvl').textContent='Level '+level+' / '+MAXL;$('bar').firstChild.style.width=(inLvl/PER*100)+'%'}
function start(){clearPipes();score=0;level=1;inLvl=0;by=0;vy=0;t=0;state='play';$('ov').style.display='none';hud();flap();banner('Level 1')}
function flap(){vy=10.5;sFlap()}
function end(win){state=win?'win':'dead';deadAt=performance.now();musicOn=false;try{if(score>best){best=score;localStorage.setItem('gb_best',best)}}catch(e){}
 win?sWin():sLose();
 $('t').textContent=win?'Kamu menang! 🏆':'Game Over';
 $('m').innerHTML='Skor: <b style="all:unset;font-weight:900">'+score+'</b> · Level '+level+'<br>Terbaik: '+best;
 $('go').textContent=win?'Main lagi':'Coba lagi';
 setTimeout(function(){$('ov').style.display='flex'},350)}
function tap(e){if(e&&e.preventDefault)e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();
 if(state==='play'){flap()}
 else if(performance.now()-deadAt>700){musicOn=true;start()}}
addEventListener('pointerdown',tap,{passive:false});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp')tap(e)});

var last=performance.now();
function loop(now){requestAnimationFrame(loop);var dt=Math.min((now-last)/1000,.04);last=now;t+=dt;
 var P=params(level),sp=(state==='play')?P.speed:(state==='menu'?3:0);
 clouds.forEach(function(c){c.position.x-=dt*.8;if(c.position.x<-22)c.position.x+=64});
 stripes.forEach(function(s){s.position.x-=sp*dt;if(s.position.x<-12)s.position.x+=48});
 if(state==='play'){
  vy=Math.max(vy-32*dt,-16);by+=vy*dt;if(by>8.5){by=8.5;vy=0}
  var last_=pipes[pipes.length-1];if(!last_||last_.x<9-P.space)spawn();
  for(var i=pipes.length-1;i>=0;i--){var p=pipes[i];p.x-=sp*dt;p.cy=p.base+Math.sin(t*p.fr+p.ph)*p.amp;
   p.top.position.set(p.x,p.cy+p.gap/2,0);p.bot.position.set(p.x,p.cy-p.gap/2,0);
   var r=.7;if(Math.abs(p.x-BX)<1.3+r*.8&&(by+r>p.cy+p.gap/2||by-r<p.cy-p.gap/2)){end(false);break}
   if(!p.passed&&p.x+1.3<BX){p.passed=true;score++;inLvl++;
    if(inLvl>=PER){if(level>=MAXL){hud();end(true);break}level++;inLvl=0;sLevel();banner('Level '+level)}else sPoint();hud()}
   if(p.x<-14){S.remove(p.top);S.remove(p.bot);pipes.splice(i,1)}}
  if(state==='play'&&by-.7<-8)end(false);
 }else if(state==='dead'){vy=Math.max(vy-32*dt,-16);by=Math.max(by+vy*dt,-7.3)}
 else if(state==='menu'||state==='win'){by=Math.sin(now/300)*.5}
 bird.position.set(BX,by,0);
 var tilt=state==='menu'?0:Math.max(-.9,Math.min(.5,vy*.06));bird.rotation.z=tilt;
 wing.rotation.z=Math.sin(now/(state==='play'?45:120))*.5;
 R.render(S,cam)}
resize();hud();requestAnimationFrame(loop);
})();
